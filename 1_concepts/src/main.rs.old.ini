use std::borrow::Cow;
use std::ptr::{self, NonNull};
use std::sync::atomic::{AtomicPtr, Ordering};
use std::marker::PhantomData;
use std::fmt;

// Узел двусвязного списка
struct Node<T> {
    data: T,
    next: AtomicPtr<Node<T>>,
    prev: AtomicPtr<Node<T>>,
}

impl<T> Node<T> {
    fn new(data: T) -> *mut Self {
        Box::into_raw(
            Box::new(
                Self {
                    data,
                    next: AtomicPtr::new(ptr::null_mut()),
                    prev: AtomicPtr::new(ptr::null_mut::<Node<T>>()),
                }
            )
        )
    }
    
    unsafe fn take_data(node: *mut Node<T>) -> T {
        let boxed_node = Box::from_raw(node);
        boxed_node.data
    }
}

pub struct ConcurrentDoublyLinkedList<T> {
    head: AtomicPtr<Node<T>>,
    tail: AtomicPtr<Node<T>>,
    len: std::sync::atomic::AtomicUsize,
    _marker: PhantomData<T>,
}

// Итератор, который проходит по списку без модификации
pub struct Iter<'a, T> {
    current: *mut Node<T>,
    list: &'a ConcurrentDoublyLinkedList<T>,
    _marker: PhantomData<&'a Node<T>>,
}

// Итератор с изменяемыми ссылками
pub struct IterMut<'a, T> {
    current: *mut Node<T>,
    list: &'a mut ConcurrentDoublyLinkedList<T>,
    _marker: PhantomData<&'a mut Node<T>>,
}

impl<T> ConcurrentDoublyLinkedList<T> {
    fn new() -> Self {
        Self { 
            head: AtomicPtr::new(ptr::null_mut()),
            tail: AtomicPtr::new(ptr::null_mut::<Node<T>>()),
            len: std::sync::atomic::AtomicUsize::new(0),
            _marker: PhantomData,
        }
    }

    pub fn push_front(&self, data: T) {
        let new_node = Node::new(data);

        loop {
            let head = self.head.load(Ordering::Acquire);
            
            unsafe {
                (*new_node).next.store(head, Ordering::Relaxed);
                (*new_node).prev.store(ptr::null_mut(), Ordering::Relaxed);
            }
            
            match self.head.compare_exchange_weak(
                head,
                new_node,
                Ordering::Release,
                Ordering::Relaxed,
            ) {
                Ok(_) => {
                    if head.is_null() {
                        self.tail.store(new_node, Ordering::Release);
                    } else {
                        unsafe {
                            (*head).prev.store(new_node, Ordering::Release);
                        }
                    }
                    self.len.fetch_add(1, Ordering::SeqCst);
                    break;
                },
                Err(_) => {
                    continue;
                }
            }
        }
    }

    pub fn push_back(&self, data: T) {
        let new_node = Node::new(data);
        
        loop {
            let tail = self.tail.load(Ordering::Acquire);
            
            unsafe {
                (*new_node).prev.store(tail, Ordering::Relaxed);
                (*new_node).next.store(ptr::null_mut(), Ordering::Relaxed);
            }
            
            match self.tail.compare_exchange_weak(
                tail,
                new_node,
                Ordering::Release,
                Ordering::Relaxed,
            ) {
                Ok(_) => {
                    if tail.is_null() {
                        self.head.store(new_node, Ordering::Release);
                    } else {
                        unsafe {
                            (*tail).next.store(new_node, Ordering::Release);
                        }
                    }
                    self.len.fetch_add(1, Ordering::SeqCst);
                    break;
                }
                Err(_) => {
                    continue;
                }
            }
        }
    }

    pub fn pop_front(&self) -> Option<T> {
        loop {
            let head = self.head.load(Ordering::Acquire);
            
            if head.is_null() {
                return None;
            }
            
            unsafe {
                let next = (*head).next.load(Ordering::Acquire);
                
                match self.head.compare_exchange_weak(
                    head,
                    next,
                    Ordering::Release,
                    Ordering::Relaxed,
                ) {
                    Ok(_) => {
                        if next.is_null() {
                            self.tail.store(ptr::null_mut(), Ordering::Release);
                        } else {
                            (*next).prev.store(ptr::null_mut(), Ordering::Release);
                        }
                        
                        self.len.fetch_sub(1, Ordering::SeqCst);
                        
                        let data = Node::take_data(head);
                        return Some(data);
                    }
                    Err(_) => {
                        continue;
                    }
                }
            }
        }
    }

    pub fn pop_back(&self) -> Option<T> {
        loop {
            let tail = self.tail.load(Ordering::Acquire);
            
            if tail.is_null() {
                return None;
            }
            
            unsafe {
                let prev = (*tail).prev.load(Ordering::Acquire);
                
                match self.tail.compare_exchange_weak(
                    tail,
                    prev,
                    Ordering::Release,
                    Ordering::Relaxed,
                ) {
                    Ok(_) => {
                        if prev.is_null() {
                            self.head.store(ptr::null_mut(), Ordering::Release);
                        } else {
                            (*prev).next.store(ptr::null_mut(), Ordering::Release);
                        }
                        
                        self.len.fetch_sub(1, Ordering::SeqCst);
                        
                        let data = Node::take_data(tail);
                        return Some(data);
                    }
                    Err(_) => {
                        continue;
                    }
                }
            }
        }
    }

    pub fn is_empty(&self) -> bool {
        self.head.load(Ordering::Acquire).is_null()
    }
    
    pub fn len(&self) -> usize {
        self.len.load(Ordering::SeqCst)
    }

    pub fn clear(&self) {
        while self.pop_front().is_some() {}
    }
    
    // Получение итератора для чтения
    pub fn iter(&self) -> Iter<'_, T> {
        Iter {
            current: self.head.load(Ordering::Acquire),
            list: self,
            _marker: PhantomData,
        }
    }
    
    // Получение итератора для чтения с конца
    pub fn iter_rev(&self) -> RevIter<'_, T> {
        RevIter {
            current: self.tail.load(Ordering::Acquire),
            list: self,
            _marker: PhantomData,
        }
    }
    
    // Получение изменяемого итератора (используется внутренняя изменяемость)
    pub fn iter_mut(&mut self) -> IterMut<'_, T> {
        IterMut {
            current: self.head.load(Ordering::Acquire),
            list: self,
            _marker: PhantomData,
        }
    }
    
    // Проверка наличия элемента (O(n) операция)
    pub fn contains(&self, predicate: impl Fn(&T) -> bool) -> bool {
        let mut current = self.head.load(Ordering::Acquire);
        
        while !current.is_null() {
            unsafe {
                if predicate(&(*current).data) {
                    return true;
                }
                current = (*current).next.load(Ordering::Acquire);
            }
        }
        
        false
    }
    
    // Найти элемент по условию
    pub fn find(&self, predicate: impl Fn(&T) -> bool) -> Option<&T> {
        let mut current = self.head.load(Ordering::Acquire);
        
        while !current.is_null() {
            unsafe {
                if predicate(&(*current).data) {
                    return Some(&(*current).data);
                }
                current = (*current).next.load(Ordering::Acquire);
            }
        }
        
        None
    }
    
    // Пройтись по всем элементам и применить функцию
    pub fn for_each(&self, mut f: impl FnMut(&T)) {
        let mut current = self.head.load(Ordering::Acquire);
        
        while !current.is_null() {
            unsafe {
                f(&(*current).data);
                current = (*current).next.load(Ordering::Acquire);
            }
        }
    }
}

// Реализация итератора для Iter
impl<'a, T> Iterator for Iter<'a, T> {
    type Item = &'a T;
    
    fn next(&mut self) -> Option<Self::Item> {
        if self.current.is_null() {
            return None;
        }
        
        unsafe {
            let result = &(*self.current).data;
            self.current = (*self.current).next.load(Ordering::Acquire);
            Some(result)
        }
    }
}

// Итератор в обратном порядке
pub struct RevIter<'a, T> {
    current: *mut Node<T>,
    list: &'a ConcurrentDoublyLinkedList<T>,
    _marker: PhantomData<&'a Node<T>>,
}

impl<'a, T> Iterator for RevIter<'a, T> {
    type Item = &'a T;
    
    fn next(&mut self) -> Option<Self::Item> {
        if self.current.is_null() {
            return None;
        }
        
        unsafe {
            let result = &(*self.current).data;
            self.current = (*self.current).prev.load(Ordering::Acquire);
            Some(result)
        }
    }
}

// Реализация итератора для IterMut
impl<'a, T> Iterator for IterMut<'a, T> {
    type Item = &'a mut T;
    
    fn next(&mut self) -> Option<Self::Item> {
        if self.current.is_null() {
            return None;
        }
        
        unsafe {
            let result = &mut (*self.current).data;
            self.current = (*self.current).next.load(Ordering::Acquire);
            Some(result)
        }
    }
}

// Реализация IntoIterator для удобного использования в for циклах
impl<'a, T> IntoIterator for &'a ConcurrentDoublyLinkedList<T> {
    type Item = &'a T;
    type IntoIter = Iter<'a, T>;
    
    fn into_iter(self) -> Self::IntoIter {
        self.iter()
    }
}

// Реализация Drop для безопасной очистки памяти
impl<T> Drop for ConcurrentDoublyLinkedList<T> {
    fn drop(&mut self) {
        self.clear();
    }
}

// Реализация Debug для удобства отладки
impl<T: fmt::Debug> fmt::Debug for ConcurrentDoublyLinkedList<T> {
    fn fmt(&self, f: &mut fmt::Formatter<'_>) -> fmt::Result {
        let mut debug_list = f.debug_list();
        
        let mut current = self.head.load(Ordering::Acquire);
        while !current.is_null() {
            unsafe {
                debug_list.entry(&&(*current).data);
                current = (*current).next.load(Ordering::Acquire);
            }
        }
        
        debug_list.finish()
    }
}

