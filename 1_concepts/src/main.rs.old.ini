    }
    
    // Способ 6: Использование contains
    println!("\n6. Проверка наличия элемента:");
    let has_hello = list.contains(|s| s == "Hello");
    println!("  Содержит 'Hello': {}", has_hello);
    
    // Сохранение элементов после итерации
    println!("\n7. Элементы остались в списке после итерации:");
    println!("  Длина после итерации: {}", list.len());
    
    // Преобразование в Vec для дальнейшей обработки
    println!("\n8. Преобразование в Vec:");
    let vec: Vec<&String> = list.iter().collect();
    println!("  Vec: {:?}", vec);
    
    // Использование методов итератора
    println!("\n9. Использование методов итератора:");
    let uppercase: Vec<String> = list
        .iter()
        .map(|s| s.to_uppercase())
        .collect();
    println!("  В верхнем регистре: {:?}", uppercase);
    
    // Фильтрация элементов
    println!("\n10. Фильтрация элементов:");
    let filtered: Vec<&String> = list
        .iter()
        .filter(|s| s.len() > 4)
        .collect();
    println!("  Элементы длиной > 4: {:?}", filtered);
}