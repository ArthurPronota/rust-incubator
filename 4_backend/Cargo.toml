[package]
name = "step_4"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0.102"
argon2 = "0.5.3"
async-graphql = {version = "7.2.1", features = ["chrono", "dataloader"]}
async-graphql-axum = "7.2.1"    # 7.2.1
axum = "0.8.8"
chrono = "0.4.44"
clap = {version = "4.6.0", features = ["derive"] }
dotenv = "0.15.0"
#jsonwebtoken = {version = "8"}
#jsonwebtoken = {version = "8.3"}
#jsonwebtoken = {version = "9.0.0"}
jsonwebtoken = {version = "9.3.0"}
serde = {version = "1.0.228", features = ["derive"]}
serde_json = "1.0.149"
sqlx = {version = "0.8.6", features = ["runtime-tokio-native-tls", "mysql", "macros"]}
tokio = {version = "1.50.0", features = ["full"]}
ureq = { version = "3.3.0", features = ["json"] }
